name: unit_saathi
description: "یونٹ ساتھی — Offline electricity unit notebook for Pakistan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management (simple, low overhead for low-end phones)
  provider: ^6.1.2

  # Camera + OCR (offline, on-device via Google ML Kit text recognition) —
  # re-add once the camera capture flow is actually implemented and wired
  # up (see lib/services/ocr_service.dart). Not imported anywhere yet, and
  # pulling them in was breaking the release build (R8 missing-class errors
  # from ML Kit's optional per-language recognizers) for no current benefit.
  # camera: ^0.10.6
  # google_mlkit_text_recognition: ^0.13.0
  # image: ^4.2.0

  # PDF generation (pure Dart, no native Android code — safe)
  pdf: ^3.11.1
  # NOTE: `printing` package removed — its Android module hardcodes an old
  # compileSdk that doesn't include android:attr/lStar, breaking the release
  # build (AAPT resource-linking error), and attempts to force a newer SDK
  # onto it via Gradle hooks didn't take effect on this Flutter version.
  # PDF sharing now goes through path_provider + share_plus instead (same
  # pattern already used for image export below).
  # printing: ^5.13.1

  # Image export for WhatsApp sharing
  screenshot: ^3.0.0
  share_plus: ^9.0.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
