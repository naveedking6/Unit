name: unit_saathi
description: "یونٹ ساتھی — Offline electricity unit notebook for Pakistan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management (simple, low overhead for low-end phones)
  provider: ^6.1.2

  # Camera + OCR (offline, on-device via Google ML Kit text recognition)
  camera: ^0.10.6
  google_mlkit_text_recognition: ^0.13.0
  image: ^4.2.0

  # PDF export (Urdu RTL support via a Nastaliq/Naskh font)
  pdf: ^3.11.1
  printing: ^5.13.1

  # Image export for WhatsApp sharing
  screenshot: ^3.0.0
  share_plus: ^9.0.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
