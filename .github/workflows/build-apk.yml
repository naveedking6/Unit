name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # This project doesn't have android/ios folders committed yet
      # (they were generated on a machine with no Flutter SDK). Generate
      # them here if missing, without touching existing lib/ or pubspec.yaml.
      - name: Ensure platform folders exist
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.unitsaathi .
          fi

      # Flutter 3.24's default template pins an older Kotlin Gradle plugin
      # than some of this app's dependencies need. Bump it directly rather
      # than changing the Flutter SDK version (which affects the theming
      # API compiled against).
      - name: Bump Kotlin Gradle plugin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i 's/id "com.android.application" version "[0-9.]*"/id "com.android.application" version "8.3.0"/' android/settings.gradle
          sed -i "s/distributionUrl=.*/distributionUrl=https\\\\:\/\/services.gradle.org\/distributions\/gradle-8.6-all.zip/" android/gradle/wrapper/gradle-wrapper.properties
          echo "--- settings.gradle ---"
          grep -n "version" android/settings.gradle
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        id: build_apk
        continue-on-error: true
        run: flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Save build log for debugging
        if: always()
        run: |
          echo "## Build log (last 200 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          mkdir -p ci-logs
          cp /tmp/build.log ci-logs/last-build.log || echo "no log" > ci-logs/last-build.log
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git checkout -B ci-debug
          git add -f ci-logs/last-build.log
          git commit -m "ci: update build log [skip ci]" || echo "nothing to commit"
          git push -f origin ci-debug 2>&1 || echo "LOG_PUSH_FAILED"

      - name: Fail job if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unit-saathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
