name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # This project doesn't have android/ios folders committed yet
      # (they were generated on a machine with no Flutter SDK). Generate
      # them here if missing, without touching existing lib/ or pubspec.yaml.
      - name: Ensure platform folders exist
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.unitsaathi .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unit-saathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
